# SPDX-License-Identifier: CC0-1.0
# Build and test on every push and pull request, in a current Arch Linux container.
name: CI

on:
  push:
  pull_request:
  # Weekly as well, so a new Dolphin release that breaks the hook shows up
  # without a push (tst_dolphinsymbols against the newest Arch package).
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch: # run by hand from the Actions tab

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      XDG_RUNTIME_DIR: /tmp/runtime-root
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja extra-cmake-modules \
            qt6-base qt6-declarative qt6-multimedia qt6-multimedia-ffmpeg qt6-webengine qt6-svg \
            kconfig kcoreaddons kcrash kfilemetadata ki18n kio kirigami kirigami-addons kservice \
            kwindowsystem purpose qqc2-desktop-style syntax-highlighting kcontacts kcalendarcore kimageformats \
            libarchive libseccomp dbus ttf-dejavu appstream \
            dolphin python
          mkdir -p -m 0700 "$XDG_RUNTIME_DIR"

      - uses: actions/checkout@v5

      - name: Release build
        run: cmake --preset release && cmake --build --preset release

      - name: Developer build
        run: cmake --preset dev && cmake --build --preset dev

      # Tests that need what the container lacks (LibreOffice; Landlock for the
      # sandbox, depending on the runner's kernel) skip themselves. Dolphin is installed
      # only for tst_dolphinsymbols: the functions the hook calls must exist in the
      # current Dolphin release (required here, skipped elsewhere).
      - name: Tests
        env:
          KWIKLOOK_REQUIRE_DOLPHIN: 1
        run: dbus-run-session -- ctest --test-dir build/dev --output-on-failure --exclude-regex qmlsmoke

      # Only the smoke test gets one retry: Qt 6.12's image loader crashes now and then
      # (CLAUDE.md, Known Pitfalls). Every other test must pass the first time.
      - name: Smoke test
        run: dbus-run-session -- ctest --test-dir build/dev --output-on-failure --tests-regex qmlsmoke --repeat until-pass:2

      # Weekly (and by hand) only, so a push never depends on KDE's server: what the hook
      # relies on in Dolphin's development branch, months before it reaches a release.
      # On a change: adapt the hook, then update tests/dolphin/dolphin-api.txt.
      - name: Dolphin's development branch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 -I tests/dolphin/check-dolphin-api.py
